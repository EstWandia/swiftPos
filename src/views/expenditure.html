<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SwiftPOS — Expenditure</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        html {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .page-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 16px 80px;
            -webkit-overflow-scrolling: touch;
        }

        .add-card {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 14px;
            margin-bottom: 18px;
        }

        .add-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .add-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .add-field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--t2);
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .add-field input {
            background: var(--s3);
            border: 1px solid var(--border);
            border-radius: var(--rs);
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            padding: 9px 11px;
            outline: none;
        }

        .add-field input:focus {
            border-color: var(--a);
        }

        #expAmount {
            width: 140px;
        }

        #expDesc {
            flex: 1;
            min-width: 200px;
        }

        .sum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 16px
        }

        .sc {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 4px 8px
        }

        .sc-lbl {
            font-size: 10px;
            color: var(--t2);
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: 6px
        }

        .sc-val {
            font-size: 22px;
            font-weight: 800;
            font-family: var(--mono)
        }

        .sc-val.r {
            color: var(--red)
        }

        .sc-val.b {
            color: var(--a)
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            align-items: center
        }

        .fi {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--rs);
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
            padding: 7px 10px;
            outline: none
        }

        .fi:focus {
            border-color: var(--a)
        }

        .qr-btn {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--rs);
            color: var(--t2);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            cursor: pointer;
            transition: all .15s
        }

        .qr-btn:hover {
            border-color: var(--a);
            color: var(--text)
        }

        .qr-btn.on {
            background: var(--a);
            border-color: var(--a);
            color: #fff
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px
        }

        th {
            font-size: 10px;
            font-weight: 700;
            color: var(--t3);
            text-transform: uppercase;
            letter-spacing: .7px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap
        }

        td {
            font-size: 13px;
            padding: 11px 12px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle
        }

        tr:hover td {
            background: var(--s2)
        }

        .pg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            padding: 10px 0
        }

        .mob-cards {
            display: none
        }

        .m-card {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 12px;
            margin-bottom: 8px
        }

        .m-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px
        }

        .m-card-name {
            font-size: 13px;
            font-weight: 700
        }

        .m-card-val {
            font-size: 15px;
            font-weight: 800;
            font-family: var(--mono);
            color: var(--red);
            flex-shrink: 0
        }

        .m-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px
        }

        .m-tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 20px;
            background: var(--s3);
            color: var(--t2)
        }

        .m-tag.blue {
            background: rgba(61, 139, 255, .12);
            color: var(--a)
        }

        .m-tag.amber {
            background: rgba(255, 179, 71, .12);
            color: var(--amber)
        }

        @media (max-width:760px) {
            .tbl-wrap {
                display: none
            }

            .mob-cards {
                display: block
            }

            #expAmount {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <span class="logo" id="bizName">⚡ SwiftPOS</span>
        <nav class="nav-links" id="navLinks"></nav>
        <div class="topbar-right">
            <div class="avatar" id="userAvatar" onclick="window.location='/auth/logout'" title="Sign out"></div>
        </div>
    </header>

    <div class="page-body">
        <h2 style="font-size:18px;margin-bottom:14px">💸 Expenditure</h2>

        <div class="add-card">
            <div class="add-row">
                <div class="add-field">
                    <label>Amount</label>
                    <input id="expAmount" type="number" step="0.01" min="0.01" placeholder="0.00"
                        onkeydown="if(event.key==='Enter')document.getElementById('expDesc').focus()">
                </div>
                <div class="add-field" style="flex:1;min-width:200px">
                    <label>Description</label>
                    <input id="expDesc" type="text" placeholder="e.g. Bought cleaning supplies"
                        onkeydown="if(event.key==='Enter')saveExpenditure()">
                </div>
                <button class="btn btn-primary" id="saveExpBtn" onclick="saveExpenditure()">💸 Add Today's
                    Expense</button>
            </div>
        </div>

        <div class="sum-grid">
            <div class="sc">
                <div class="sc-lbl">Today's Total</div>
                <div class="sc-val r" id="sumToday">—</div>
            </div>
            <div class="sc">
                <div class="sc-lbl">Period Total</div>
                <div class="sc-val r" id="sumPeriod">—</div>
            </div>
            <div class="sc">
                <div class="sc-lbl">Entries</div>
                <div class="sc-val b" id="sumCount">—</div>
            </div>
        </div>

        <div class="filters">
            <button class="qr-btn on" id="qrToday" onclick="setQuickRange('today')">Today</button>
            <button class="qr-btn" id="qrWeek" onclick="setQuickRange('week')">This Week</button>
            <button class="qr-btn" id="qrMonth" onclick="setQuickRange('month')">This Month</button>
            <span style="font-size:12px;color:var(--t2)">From</span>
            <input class="fi" type="date" id="fFrom" onchange="onDateChange()">
            <span style="font-size:12px;color:var(--t2)">To</span>
            <input class="fi" type="date" id="fTo" onchange="onDateChange()">
        </div>

        <div class="tbl-wrap" style="overflow-x:auto;min-width:0">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Added By</th>
                        <th>Time</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="expBody"></tbody>
            </table>
        </div>
        <div class="mob-cards" id="expCards"></div>
        <div class="pg" id="pg"></div>
    </div>

    <div class="statusbar"><span><span class="dot"></span>Online</span><span id="clock" class="mono ml-auto"></span>
    </div>

    <div id="toast"></div>
    <script src="/js/api.js"></script>
    <script>
        let page = 0, totalRows = 0, currentUser = null, lastRows = [];
        const LIMIT = 50;

        (async function () {
            try {
                const { user } = await API.get('/api/me'); currentUser = user;
                document.getElementById('userAvatar').textContent = user.name.slice(0, 2).toUpperCase();
                document.getElementById('bizName').textContent = user.business?.name || 'SwiftPOS';
                window._currSym = user.business?.currency_sym || '€';
                buildNav(user.role, '/expenditure');
            } catch { window.location.href = '/login'; return; }
            startClock('clock');

            const t = todayStr();
            document.getElementById('fFrom').value = t;
            document.getElementById('fTo').value = t;

            await loadExpenditures();
        })();

        function todayStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        async function saveExpenditure() {
            const amount = parseFloat(document.getElementById('expAmount').value);
            const description = document.getElementById('expDesc').value.trim();

            if (!amount || amount <= 0) { showToast('❌ Enter a valid amount', 'error'); document.getElementById('expAmount').focus(); return; }
            if (!description) { showToast('❌ Enter a description', 'error'); document.getElementById('expDesc').focus(); return; }

            const btn = document.getElementById('saveExpBtn');
            btn.disabled = true;
            try {
                await API.post('/api/expenditures', { amount, description, expense_date: todayStr() });
                showToast('✅ Expense recorded for today', 'success');
                document.getElementById('expAmount').value = '';
                document.getElementById('expDesc').value = '';
                document.getElementById('expAmount').focus();

                // If we're currently viewing a range that includes today, refresh the list
                const df = document.getElementById('fFrom').value, dt = document.getElementById('fTo').value;
                const t = todayStr();
                if (df <= t && t <= dt) { page = 0; loadExpenditures(); }
            } catch (e) { showToast(e.message, 'error'); }
            finally { btn.disabled = false; }
        }

        function setQuickRange(range) {
            document.querySelectorAll('.qr-btn').forEach(b => b.classList.remove('on'));
            const now = new Date();
            let from, to = todayStr();

            if (range === 'today') {
                document.getElementById('qrToday').classList.add('on');
                from = todayStr();
            } else if (range === 'week') {
                document.getElementById('qrWeek').classList.add('on');
                const day = now.getDay() === 0 ? 6 : now.getDay() - 1;
                const monday = new Date(now); monday.setDate(now.getDate() - day);
                const pad = n => String(n).padStart(2, '0');
                from = `${monday.getFullYear()}-${pad(monday.getMonth() + 1)}-${pad(monday.getDate())}`;
            } else if (range === 'month') {
                document.getElementById('qrMonth').classList.add('on');
                from = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
            }

            document.getElementById('fFrom').value = from;
            document.getElementById('fTo').value = to;
            page = 0; loadExpenditures();
        }

        function onDateChange() {
            document.querySelectorAll('.qr-btn').forEach(b => b.classList.remove('on'));
            page = 0; loadExpenditures();
        }

        async function loadExpenditures() {
            const df = document.getElementById('fFrom').value || todayStr();
            const dt = document.getElementById('fTo').value || todayStr();

            document.getElementById('expBody').innerHTML = '<tr><td colspan="6"><div class="spinner"></div></td></tr>';
            document.getElementById('expCards').innerHTML = '';

            try {
                const { rows, total, total_amount } = await API.get(`/api/expenditures?limit=${LIMIT}&offset=${page * LIMIT}&date_from=${df}&date_to=${dt}`);
                totalRows = total;
                document.getElementById('sumPeriod').textContent = fmt(total_amount);
                document.getElementById('sumCount').textContent = total;
                renderTable(rows);
                renderPg();
                loadTodayTotal();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function loadTodayTotal() {
            try {
                const t = todayStr();
                const { total_amount } = await API.get(`/api/expenditures?date_from=${t}&date_to=${t}&limit=1`);
                document.getElementById('sumToday').textContent = fmt(total_amount);
            } catch (_) { }
        }

        function renderTable(rows) {
            lastRows = rows;
            const canDeleteAny = currentUser && currentUser.role !== 'cashier';

            if (!rows.length) {
                const empty = '<div class="empty-state"><div class="ei">💸</div><h3>No expenditure logged</h3><p>Try a different date range</p></div>';
                document.getElementById('expBody').innerHTML = `<tr><td colspan="6">${empty}</td></tr>`;
                document.getElementById('expCards').innerHTML = empty;
                return;
            }

            document.getElementById('expBody').innerHTML = rows.map(r => {
                const canDelete = canDeleteAny || (currentUser && r.cashier_id === currentUser.id && r.expense_date === todayStr());
                return `<tr>
        <td style="color:var(--t2);font-size:12px">${cleanDate(r.expense_date)}</td>
        <td class="mono" style="color:var(--red)"><strong>${fmt(r.amount)}</strong></td>
        <td>${r.description}</td>
        <td style="font-size:12px">${r.cashier_name}</td>
        <td style="color:var(--t3);font-size:11px;white-space:nowrap">${fmtDateTime(r.created_at)}</td>
        <td>${canDelete ? `<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="deleteExpenditure(${r.id})">✕</button>` : ''}</td>
      </tr>`;
            }).join('');

            document.getElementById('expCards').innerHTML = rows.map(r => {
                const canDelete = canDeleteAny || (currentUser && r.cashier_id === currentUser.id && r.expense_date === todayStr());
                return `<div class="m-card">
        <div class="m-card-top">
          <div class="m-card-name">${r.description}</div>
          <div class="m-card-val">${fmt(r.amount)}</div>
        </div>
        <div class="m-card-meta">
          <span class="m-tag">${cleanDate(r.expense_date)}</span>
          <span class="m-tag amber">${r.cashier_name}</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
          <div style="font-size:10px;color:var(--t3)">${fmtDateTime(r.created_at)}</div>
          ${canDelete ? `<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="deleteExpenditure(${r.id})">✕ Remove</button>` : ''}
        </div>
      </div>`;
            }).join('');
        }

        async function deleteExpenditure(id) {
            if (!confirm('Remove this expenditure entry?')) return;
            try {
                await API.delete(`/api/expenditures/${id}`);
                showToast('Removed', 'success');
                loadExpenditures();
            } catch (e) { showToast(e.message, 'error'); }
        }

        function renderPg() {
            const pages = Math.ceil(totalRows / LIMIT);
            if (pages <= 1) { document.getElementById('pg').innerHTML = ''; return; }
            let h = '';
            if (page > 0) h += `<button class="btn btn-ghost" onclick="goPage(${page - 1})">← Prev</button>`;
            h += `<span style="font-size:12px;color:var(--t2)">Page ${page + 1} of ${pages} &nbsp;·&nbsp; ${totalRows} entries</span>`;
            if (page < pages - 1) h += `<button class="btn btn-ghost" onclick="goPage(${page + 1})">Next →</button>`;
            document.getElementById('pg').innerHTML = h;
        }

        function goPage(p) { page = p; loadExpenditures(); }

        function cleanDate(d) {
            // expense_date comes back as 'YYYY-MM-DD' or a Date; normalize to a short label
            const s = typeof d === 'string' ? d.slice(0, 10) : new Date(d).toISOString().slice(0, 10);
            const [y, m, day] = s.split('-').map(Number);
            return new Date(y, m - 1, day).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
    </script>
</body>

</html>
